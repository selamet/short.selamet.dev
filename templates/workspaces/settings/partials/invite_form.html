<form id="invite-form" method="post" hx-post="{% url 'workspaces:settings_members' current_workspace.slug %}" hx-target="#invite-form" hx-swap="outerHTML" class="flex flex-wrap items-end gap-3" novalidate>
  {% csrf_token %}
  <label class="flex flex-1 flex-col gap-1"><span class="text-[11.5px] font-medium uppercase tracking-wide text-ink-muted">Invite by email</span>
    <input type="email" name="email" value="{{ form.email.value|default:'' }}" placeholder="name@company.com" required class="rounded-sm border border-line bg-surface-2 px-3 py-2"></label>
  <label class="flex flex-col gap-1"><span class="text-[11.5px] font-medium uppercase tracking-wide text-ink-muted">Role</span>
    <select name="role" class="rounded-sm border border-line bg-surface-2 px-3 py-2"><option value="member">Member</option><option value="admin">Admin</option></select></label>
  <button type="submit" class="rounded-md bg-accent px-4 py-2 font-semibold text-white hover:bg-accent-hover">Invite</button>
  {% if form.email.errors %}<span class="w-full text-danger" role="alert">{{ form.email.errors.0 }}</span>{% elif form.non_field_errors %}<span class="w-full text-danger" role="alert">{{ form.non_field_errors.0 }}</span>{% endif %}
</form>
