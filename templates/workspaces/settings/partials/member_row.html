<li id="member-{{ m.pk }}" class="flex flex-wrap items-center gap-3 px-4 py-3">
  <span class="flex-1 min-w-0"><span class="font-medium">{{ m.user.get_short_name }}</span> <span class="mono text-ink-muted">{{ m.user.email }}</span></span>
  {% if m.role == 'owner' %}
    <span class="rounded-full border border-line px-2 py-1 text-[11px] uppercase tracking-wide">Owner</span>
  {% else %}
    <form hx-post="{% url 'workspaces:member_role' current_workspace.slug m.pk %}" hx-target="#member-{{ m.pk }}" hx-swap="outerHTML" hx-trigger="change">
      {% csrf_token %}
      <select name="role" class="rounded-sm border border-line bg-surface-2 px-2 py-1"><option value="member" {% if m.role == 'member' %}selected{% endif %}>Member</option><option value="admin" {% if m.role == 'admin' %}selected{% endif %}>Admin</option></select>
    </form>
    <button type="button" hx-get="{% url 'workspaces:member_remove_confirm' current_workspace.slug m.pk %}" hx-target="#modal" class="text-danger underline">Remove</button>
  {% endif %}
</li>
