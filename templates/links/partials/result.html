<div class="rounded-md border border-line bg-surface p-4">
  <p class="text-[11.5px] font-medium uppercase tracking-wide text-ink-muted">Link ready</p>
  <p class="mt-2 mono text-[15px]">{{ short_url }}</p>
  <div class="mt-3 flex gap-2">
    <button type="button" class="rounded-md border border-line px-3 py-2 font-medium hover:bg-surface-2" data-copy="{{ short_url }}">Copy</button>
    <button type="button" class="rounded-md border border-line px-3 py-2 font-medium text-ink-muted" disabled title="QR codes arrive in a later release">QR code</button>
  </div>
</div>
