# Production stack. TLS and routing are handled by the host's reverse proxy,
# which forwards the public domain to the port published in a host-side override
# (for example 127.0.0.1:8107 -> web:8000). Postgres and Redis are external.
services:
  web:
    build: .
    image: short:latest
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      TASKS_BACKEND: django_tasks_db.backend.DatabaseBackend
      RUN_MIGRATIONS: "1"
    volumes:
      - media:/data/media
    restart: unless-stopped
  worker:
    image: short:latest
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      TASKS_BACKEND: django_tasks_db.backend.DatabaseBackend
    # django-tasks-db never prunes its own result rows, so a small loop runs the
    # prune command once a day alongside the worker, in the same container, without
    # pulling in a scheduler (there is none in this stack) for a single periodic job.
    command:
      - sh
      - -c
      - |
        (while true; do sleep 86400; python manage.py prune_db_task_results; done) &
        exec python manage.py db_worker
    volumes:
      - media:/data/media
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
volumes:
  media:
