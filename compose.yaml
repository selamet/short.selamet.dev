# Production stack. TLS and routing are handled by the host's reverse proxy,
# which forwards the public domain to the port published in a host-side override
# (for example 127.0.0.1:8107 -> web:8000). Postgres and Redis are external.
services:
  web:
    build: .
    image: short:latest
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      TASKS_BACKEND: django_tasks_db.backend.DatabaseBackend
      RUN_MIGRATIONS: "1"
    volumes:
      - media:/data/media
    restart: unless-stopped
  worker:
    image: short:latest
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      TASKS_BACKEND: django_tasks_db.backend.DatabaseBackend
    # supercronic runs docker/crontab in the background, which only ever enqueues
    # the scheduled analytics/maintenance jobs (see apps.analytics.tasks and
    # apps.analytics.management.commands.enqueue_scheduled) and the django-tasks-db
    # prune -- nothing schedules itself inside the web process. The worker itself is
    # exec'd, not started as a second background job, so it keeps PID 1's signal
    # handling and still shuts down cleanly on `docker stop`.
    command:
      - sh
      - -c
      - |
        supercronic /app/docker/crontab &
        exec python manage.py db_worker
    volumes:
      - media:/data/media
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
volumes:
  media:
