services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: short
      POSTGRES_PASSWORD: short
      POSTGRES_DB: short
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U short"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  pgdata:
